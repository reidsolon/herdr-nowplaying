# Copy to the plugin config dir (print it with: herdr plugin config-dir reidsolon.nowplaying)
# as config.toml.

# auto = spotify_player if installed, otherwise the Spotify desktop app (AppleScript)
backend = "auto"

# Path to spotify_player if it isn't on PATH or in ~/.cargo/bin
spotify_player_bin = ""

# Start the spotify_player daemon when the herdr server starts
autostart_player = false
