# Every Now Playing setting. Setup (`nowplaying setup`) writes config.toml in the plugin config dir
# (print it with: herdr plugin config-dir reidsolon.nowplaying); edit that file to change these.

# spotify_player, applescript (the Spotify desktop app), or auto = spotify_player if installed,
# otherwise the Spotify app
backend = "auto"

# Path to spotify_player if it isn't on PATH or in ~/.cargo/bin
spotify_player_bin = ""

# Start the spotify_player daemon when the herdr server starts
autostart_player = false

# `nowplaying bar` (herdr's tab bar): key hints shown before the track.
# Match them to your key bindings; "" hides one, bar_controls = false hides all.
bar_controls = true
bar_key_previous = ","
bar_key_play_pause = "Space"
bar_key_next = "."
